version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncmate_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=syncmate-production-secret-key-2026
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=syncmate
      - POSTGRES_PASSWORD=syncmate_pass
      - POSTGRES_DB=syncmate_db
      - REDIS_HOST=redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: syncmate_postgres
    restart: always
    environment:
      POSTGRES_USER: syncmate
      POSTGRES_PASSWORD: syncmate_pass
      POSTGRES_DB: syncmate_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: syncmate_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
